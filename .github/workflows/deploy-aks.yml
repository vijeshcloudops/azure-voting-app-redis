name: Deploy Azure Voting App to AKS

on:
    push:
        branches:
            - main
        paths:
            - deployment/aks/azure-vote.yaml

    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    deploy:
        name: Deploy to AKS
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Login to Azure using OIDC
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Install kubectl and kubelogin
              run: az aks install-cli

            - name: Get AKS credentials
              run: |
                  az aks get-credentials \
                    --resource-group rg-azure-voting-lab \
                    --name aks-voting-lab \
                    --overwrite-existing

                  kubelogin convert-kubeconfig -l azurecli

            - name: Validate committed image tags
              run: |
                  set -e

                  grep -E 'image: .*azure-vote-(front|redis):' deployment/aks/azure-vote.yaml

                  grep -qE 'image: vijesh89/azure-vote-front:[0-9a-f]+' deployment/aks/azure-vote.yaml
                  grep -qE 'image: vijesh89/azure-vote-redis:[0-9a-f]+' deployment/aks/azure-vote.yaml

            - name: Apply committed manifest
              run: |
                  kubectl apply -f deployment/aks/azure-vote.yaml

            - name: Verify deployment rollout
              run: |
                  kubectl rollout status deployment/azure-vote-front --timeout=180s
                  kubectl rollout status deployment/azure-vote-back --timeout=180s

                  kubectl get deployments,services,pods
