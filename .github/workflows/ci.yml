name: Azure Voting App - CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    validate:
        name: Validate Application
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Verify application files
              run: |
                  test -f azure-vote/Dockerfile
                  test -f azure-vote/azure-vote/main.py
                  test -f redis/Dockerfile
                  test -f deployment/aks/azure-vote.yaml
                  echo "Required application files are present."

    build-images:
        name: Build, Scan and Publish Images
        runs-on: ubuntu-latest
        needs: validate

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build frontend image
              uses: docker/build-push-action@v6
              with:
                  context: ./azure-vote
                  file: ./azure-vote/Dockerfile
                  load: true
                  push: false
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/azure-vote-front:${{ github.sha }}

            - name: Build Redis image
              uses: docker/build-push-action@v6
              with:
                  context: ./redis
                  file: ./redis/Dockerfile
                  load: true
                  push: false
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/azure-vote-redis:${{ github.sha }}

            - name: Scan frontend image with Trivy
              uses: aquasecurity/trivy-action@0.36.0
              with:
                  scan-type: image
                  image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/azure-vote-front:${{ github.sha }}
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  format: table
                  exit-code: "1"

            - name: Scan Redis image with Trivy
              uses: aquasecurity/trivy-action@0.36.0
              with:
                  scan-type: image
                  image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/azure-vote-redis:${{ github.sha }}
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  format: table
                  exit-code: "1"

            - name: Log in to Docker Hub
              if: github.event_name == 'push'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Publish frontend image
              if: github.event_name == 'push'
              run: docker push "${{ secrets.DOCKERHUB_USERNAME }}/azure-vote-front:${{ github.sha }}"

            - name: Publish Redis image
              if: github.event_name == 'push'
              run: docker push "${{ secrets.DOCKERHUB_USERNAME }}/azure-vote-redis:${{ github.sha }}"
