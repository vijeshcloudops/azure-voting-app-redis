name: Azure Voting App - CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    validate:
        name: Validate Application
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Verify application files
              run: |
                  test -f azure-vote/Dockerfile
                  test -f azure-vote/azure-vote/main.py
                  test -f redis/Dockerfile
                  test -f deployment/aks/azure-vote.yaml
                  echo "Required application files are present."

    build-images:
        name: Build and Publish Images
        runs-on: ubuntu-latest
        needs: validate

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              if: github.event_name == 'push'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and publish frontend
              uses: docker/build-push-action@v6
              with:
                  context: ./azure-vote
                  file: ./azure-vote/Dockerfile
                  push: ${{ github.event_name == 'push' }}
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/azure-vote-front:${{ github.sha }}

            - name: Build and publish Redis
              uses: docker/build-push-action@v6
              with:
                  context: ./redis
                  file: ./redis/Dockerfile
                  push: ${{ github.event_name == 'push' }}
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/azure-vote-redis:${{ github.sha }}
