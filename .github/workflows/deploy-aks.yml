name: Deploy Azure Voting App to AKS

on:
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Login to Azure using OIDC
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Install kubectl and kubelogin
              run: az aks install-cli

            - name: Get AKS credentials
              run: |
                  az aks get-credentials \
                    --resource-group rg-azure-voting-lab \
                    --name aks-voting-lab \
                    --overwrite-existing

                  kubelogin convert-kubeconfig -l azurecli

            - name: Deploy application
              run: |
                  kubectl apply -f deployment/aks/azure-vote.yaml

                  kubectl set image deployment/azure-vote-front \
                    azure-vote-front=${{ secrets.DOCKERHUB_USERNAME }}/azure-vote-front:${GITHUB_SHA}

                  kubectl set image deployment/azure-vote-back \
                    azure-vote-back=${{ secrets.DOCKERHUB_USERNAME }}/azure-vote-redis:${GITHUB_SHA}

            - name: Verify rollout
              run: |
                  kubectl rollout status deployment/azure-vote-front --timeout=180s
                  kubectl rollout status deployment/azure-vote-back --timeout=180s
                  kubectl get deployments,services,pods
