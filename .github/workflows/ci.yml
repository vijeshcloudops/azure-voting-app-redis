name: Azure Voting App - CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - deployment/aks/azure-vote.yaml

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    name: Validate Application files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify application files
        run: |
          test -f azure-vote/Dockerfile
          test -f azure-vote/azure-vote/main.py
          test -f redis/Dockerfile
          test -f deployment/aks/azure-vote.yaml
          echo "Required application files are present."

  build-images:
    name: Build, Scan and Publish Images
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./azure-vote
          file: ./azure-vote/Dockerfile
          load: true
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/azure-vote-front:${{ github.sha }}

      - name: Build Redis image
        uses: docker/build-push-action@v6
        with:
          context: ./redis
          file: ./redis/Dockerfile
          load: true
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/azure-vote-redis:${{ github.sha }}

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/azure-vote-front:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Scan Redis image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/azure-vote-redis:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish frontend image
        if: github.event_name == 'push'
        run: docker push "${{ secrets.DOCKERHUB_USERNAME }}/azure-vote-front:${GITHUB_SHA}"

      - name: Publish Redis image
        if: github.event_name == 'push'
        run: docker push "${{ secrets.DOCKERHUB_USERNAME }}/azure-vote-redis:${GITHUB_SHA}"

      - name: Update and commit Kubernetes manifest
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          MANIFEST="deployment/aks/azure-vote.yaml"

          sed -i \
            "s|^\([[:space:]]*image: \).*azure-vote-front:.*|\1${DOCKERHUB_USERNAME}/azure-vote-front:${IMAGE_TAG}|" \
            "$MANIFEST"

          sed -i \
            "s|^\([[:space:]]*image: \).*azure-vote-redis:.*|\1${DOCKERHUB_USERNAME}/azure-vote-redis:${IMAGE_TAG}|" \
            "$MANIFEST"

          grep -E 'image: .*azure-vote-(front|redis):' "$MANIFEST"

          grep -q "image: ${DOCKERHUB_USERNAME}/azure-vote-front:${IMAGE_TAG}" "$MANIFEST"
          grep -q "image: ${DOCKERHUB_USERNAME}/azure-vote-redis:${IMAGE_TAG}" "$MANIFEST"

          if git diff --quiet -- "$MANIFEST"; then
            echo "Manifest already has these image tags."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$MANIFEST"
          git commit -m "Update AKS image tags to ${IMAGE_TAG}"
          git push origin HEAD:main
